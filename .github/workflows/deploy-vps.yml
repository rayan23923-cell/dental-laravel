name: Deploy to VPS

# Ships main to the VPS (https://dental.azoclinic.duckdns.org) so it runs the
# same code as the offline package, which offline-windows.yml builds from the
# same pushes. Copies the repo over SSH and runs deploy/vps/deploy.sh, which
# rebuilds the Docker image; the app container migrates on start.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST     server address
#   VPS_USER     SSH user (needs sudo for docker)
#   VPS_SSH_KEY  private key for that user, without a passphrase
#   VPS_APP_DIR  app folder on the server, e.g. /home/ubuntu/dental-laravel
# Until VPS_HOST is set the job is skipped. VPS_USER and VPS_APP_DIR default to
# ubuntu and /home/ubuntu/dental-laravel.
# Since 2026-11-25 the server is the AWS EC2 one (16.16.76.126, t3.small, 2 GB)
# shared with the files site and the SIS behind one Caddy; deploy.sh adds this
# site to that Caddy the first time.
# Every push to main, app-only changes included (2026-10-19, by request:
# "عند رفع تحديث كذلك حدث موقع الاستضافة"), so the site always runs the same
# commit as the apps and the offline package built from that push.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      admin_password_hash:
        description: Optional bcrypt hash to set as the admin account's password (never the password itself)
        required: false
        default: ''

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check the VPS secrets
        id: cfg
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS secrets are not set; skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'yes'

      - name: Set up SSH
        if: steps.cfg.outputs.ready == 'yes'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          # A key pasted on one line (line breaks turned into spaces) is put back into PEM shape.
          if [ "$(grep -c . ~/.ssh/vps_key)" -le 2 ] && grep -q -- '-----BEGIN' ~/.ssh/vps_key; then
            python3 - <<'PY'
          import os, re
          p = os.path.expanduser('~/.ssh/vps_key')
          t = open(p).read().strip()
          m = re.match(r'(-----BEGIN [A-Z ]+-----)(.*?)(-----END [A-Z ]+-----)', t, re.S)
          if m:
              body = ''.join(m.group(2).split())
              lines = [body[i:i+64] for i in range(0, len(body), 64)]
              open(p, 'w').write(m.group(1) + '\n' + '\n'.join(lines) + '\n' + m.group(3) + '\n')
          PY
          fi
          chmod 600 ~/.ssh/vps_key
          ssh-keygen -y -f ~/.ssh/vps_key >/dev/null && echo "key reads OK" || echo "::error::VPS_SSH_KEY is not a valid private key (paste the whole .pem file, including the BEGIN and END lines)."
          # Stray spaces or line breaks in the secret are dropped; shape only, never the value.
          host=$(printf '%s' "$VPS_HOST" | tr -d ' \r\n\t')
          echo "VPS_HOST is 16.16.76.126: $([ "$host" = 16.16.76.126 ] && echo yes || echo "no (${#host} characters)")"
          echo "VPS_ADDR=$host" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 10 -H "$host" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "SSH on $host not answering yet (try $i)"; sleep 5
          done
          grep -q . ~/.ssh/known_hosts || { echo "::error::Could not reach SSH (port 22) on the server."; exit 1; }

      - name: Copy the code and deploy
        if: steps.cfg.outputs.ready == 'yes'
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/home/ubuntu/dental-laravel' }}
        run: |
          # .env, storage and built files on the server are left alone.
          tar czf /tmp/app.tgz \
            --exclude='./.git' --exclude='./.github' --exclude='./node_modules' --exclude='./vendor' \
            --exclude='./.env' --exclude='./storage' --exclude='./public/build' --exclude='./public/downloads' \
            --exclude='./public/storage' --exclude='./flutter_app' --exclude='./offline' --exclude='./tests' .
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_ADDR" "mkdir -p '$VPS_APP_DIR' && tar xzf - -C '$VPS_APP_DIR'" < /tmp/app.tgz
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_ADDR" "cd '$VPS_APP_DIR' && sh deploy/vps/deploy.sh"

      - name: Set the admin password
        if: steps.cfg.outputs.ready == 'yes' && inputs.admin_password_hash != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
          HASH: ${{ inputs.admin_password_hash }}
        run: |
          printf '%s' "$HASH" | grep -Eq '^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$' || { echo "::error::Not a bcrypt hash."; exit 1; }
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_ADDR" "sudo docker exec -e NEW_HASH='$HASH' dental-app php artisan tinker --execute='DB::table(\"users\")->where(\"username\",\"admin\")->update([\"password\" => getenv(\"NEW_HASH\")]); echo \"updated\";'"

      - name: Check the site answers
        if: steps.cfg.outputs.ready == 'yes'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://dental.azoclinic.duckdns.org/login || true)
            [ "$code" = 200 ] && { echo "Login page answers 200."; exit 0; }
            sleep 5
          done
          echo "Login page did not answer 200 (last: $code)."; exit 1
