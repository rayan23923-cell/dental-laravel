name: Play reviewer demo account (hosting)

# 2026-11-04, by request: a demo student (doctor) account for the Google Play
# reviewer. No stage, group or patients, so it sees no real patient data, and
# no welcome email is queued. Its own "Demo (Play review)" stage keeps it
# out of the real stages' lists; saveQuietly skips the default-group hook. Re-running resets its password.
on:
  push:
    branches: [claude/project-thread-ahicrf]
    paths: [.github/workflows/play-reviewer-account.yml]
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create or reset the reviewer account
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PW="Review$(openssl rand -hex 4)"
          php_code='$d = App\Models\Doctor::firstOrNew(["username" => "playreview"]); $d->fill(["name" => "Google Play Reviewer", "email" => "play.review@azoclinic.duckdns.org", "password" => "'"$PW"'", "locale" => "ar"]); if (! $d->education_type_id) { $d->education_type_id = App\Models\EducationType::orderBy("id")->value("id"); } if (! $d->academic_session_id) { $d->academic_session_id = App\Services\AcademicSessionHelper::resolveId(); } if (! $d->stage_id) { $d->stage_id = App\Models\Stage::firstOrCreate(["name" => "Demo (Play review)"], ["education_type_id" => $d->education_type_id])->id; } $d->saveQuietly(); echo "doctor id=".$d->id." stage=".var_export($d->stage_id, true)." groups=".DB::table("doctor_group_members")->where("doctor_id", $d->id)->count().PHP_EOL;'
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "sudo docker exec -u www-data dental-app php artisan tinker --execute=$(printf '%q' "$php_code")"
          echo "LOGIN username: playreview / email: play.review@azoclinic.duckdns.org"
          echo "PW spaced (remove the spaces): $(printf '%s' "$PW" | sed 's/./& /g')"
