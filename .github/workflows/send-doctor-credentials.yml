name: Send doctors their login details (hosting)

# Run by hand (Actions > this workflow > Run workflow), 2026-11-01 by
# request: on the hosting (VPS), give the doctors of the chosen stages new
# 8-digit passwords and queue their login emails, which link to the offline
# clinic server (clinic.lan and its IP; that server has no internet, so it
# can't send mail itself). The login file is kept on the VPS and downloaded
# from /users/bulk-credentials (super admins) to save the same passwords on
# the offline server. Uses the same secrets as deploy-vps.yml.
on:
  workflow_dispatch:
    inputs:
      stages:
        description: Stage names (or ids), comma separated
        default: الرابعة,الخامسة
        required: true
      login_url:
        description: Link in the email
        default: https://clinic.lan/login
        required: true
      alt_url:
        description: Alternative link (the server IP)
        default: https://192.168.68.52/login
        required: false
      dry_run:
        description: Only show who would get an email
        type: boolean
        default: false

concurrency:
  group: send-doctor-credentials
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Reset passwords and queue the emails
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          STAGES: ${{ inputs.stages }}
          LOGIN_URL: ${{ inputs.login_url }}
          ALT_URL: ${{ inputs.alt_url }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=""
          IFS=','
          for s in $STAGES; do
            s=$(printf '%s' "$s" | tr -d "'\"\\\\" | xargs)
            [ -n "$s" ] && args="$args --stage='$s'"
          done
          unset IFS
          args="$args --login-url='$(printf '%s' "$LOGIN_URL" | tr -d "'")'"
          [ -n "$ALT_URL" ] && args="$args --alt-url='$(printf '%s' "$ALT_URL" | tr -d "'")'"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; else args="$args --save-file"; fi
          # Names, usernames and emails only: passwords are never printed.
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "sudo docker exec dental-app php artisan doctors:send-credentials $args"

      - name: Queue status
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "sudo docker exec dental-app php artisan tinker --execute='echo \"pending: \".App\\Models\\QueuedEmail::where(\"status\",\"pending\")->count().\", sent today: \".App\\Models\\QueuedEmail::where(\"status\",\"sent\")->where(\"sent_at\",\">=\",now()->startOfDay())->count().\", failed: \".App\\Models\\QueuedEmail::where(\"status\",\"failed\")->count().PHP_EOL;'" || true
