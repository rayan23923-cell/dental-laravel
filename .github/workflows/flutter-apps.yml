name: Flutter apps (Android, iOS, Windows)

# Builds the Flutter app in flutter_app/ for all three platforms against the
# live server (AppConfig.productionBaseUrl) and publishes the files as a
# GitHub release. Runs on any push that touches flutter_app/, or by hand.
on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apps.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  API_BASE_URL: https://dental.azoclinic.duckdns.org/api/v1

defaults:
  run:
    working-directory: flutter_app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check the live server answers
        run: curl -sS -o /dev/null -w "%{http_code}\n" "$API_BASE_URL/clinic-settings" || true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../DentalClinicApp-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: DentalClinicApp-android.apk

  ios:
    # Unsigned .ipa (no Apple Developer account) — install with AltStore /
    # Sideloadly, which sign it with the user's own Apple ID.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: cd ios && pod install --repo-update
      - name: Strip NFC entitlement (needs a paid Apple team)
        run: |
          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Package unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr ../../../DentalClinicApp-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: DentalClinicApp-ios-unsigned.ipa

  windows:
    runs-on: windows-latest
    env:
      # The runner's CMake 4 refuses firebase_cpp_sdk_windows'
      # cmake_minimum_required(<3.5) without this.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ..\DentalClinicApp-windows.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\setup.iss "/DMyAppVersion=$version"
          Copy-Item build\windows\installer\DentalClinicSetup-*.exe ..\DentalClinicApp-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            DentalClinicApp-windows.zip
            DentalClinicApp-windows-setup.exe

  release:
    needs: [android, ios, windows]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Dental Clinic App build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Android (.apk), iPhone (unsigned .ipa) and Windows (installer + zip), built from ${{ github.ref_name }} @ ${{ github.sha }}.
            API: ${{ env.API_BASE_URL }}
          files: dist/*
          fail_on_unmatched_files: false
