name: Offline Windows package

# Builds a self-contained Windows folder of the whole web system (PHP,
# MariaDB, the app with vendor/ and built assets) that runs with no
# internet. See offline/README.md. Runs on pushes touching the app or
# offline/, or by hand.
on:
  push:
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'routes/**'
      - 'public/**'
      - 'composer.*'
      - 'package*.json'
      - 'offline/**'
      - '.github/workflows/offline-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PHP_MINOR: '8.3'
  # Never ship an older PHP: 8.3.36 fixes CVE-2026-109618/109619 (2026-10-22).
  PHP_MIN_VERSION: '8.3.36'
  MARIADB_VERSION: '10.11.10'
  CADDY_VERSION: '2.8.4'
  COREDNS_VERSION: '1.12.3'

jobs:
  panel:
    # The control panel (DentalClinic.exe), compiled with the .NET Framework
    # compiler that ships with Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile DentalClinic.exe
        shell: pwsh
        working-directory: offline/windows/panel
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /codepage:65001 /optimize+ `
            /out:DentalClinic.exe /win32icon:icon.ico /win32manifest:app.manifest `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Management.dll /r:System.Core.dll `
            /r:System.Web.Extensions.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll DentalClinic.cs
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: offline/windows/panel/DentalClinic.exe
          retention-days: 3

  client:
    # The program for the other computers (offline/windows/client): a WebView2
    # window with silent printing, its installer, and a check that it starts
    # and renders a ticket on a real Windows machine.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WEBVIEW2_SDK: '1.0.2903.40'
    defaults:
      run:
        shell: pwsh
        working-directory: offline/windows/client
    steps:
      - uses: actions/checkout@v4
      - name: WebView2 SDK and runtime bootstrapper
        run: |
          New-Item -ItemType Directory -Force build, build\x64, build\x86 | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$env:WEBVIEW2_SDK/microsoft.web.webview2.$env:WEBVIEW2_SDK.nupkg" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2
          Copy-Item wv2\lib\net462\Microsoft.Web.WebView2.Core.dll, wv2\lib\net462\Microsoft.Web.WebView2.WinForms.dll build\
          Copy-Item wv2\runtimes\win-x64\native\WebView2Loader.dll build\x64\
          Copy-Item wv2\runtimes\win-x86\native\WebView2Loader.dll build\x86\
          Copy-Item ..\panel\icon.ico, setup.iss build\
          # Evergreen bootstrapper: the installer runs it only when Windows has no WebView2.
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build\MicrosoftEdgeWebview2Setup.exe
          if ((Get-Item build\MicrosoftEdgeWebview2Setup.exe).Length -lt 100000) { throw 'WebView2 bootstrapper download failed.' }
      - name: Compile DentalClinicClient.exe
        run: |
          # The client's version is the offline build number (auto-update compares it).
          (Get-Content DentalClinicClient.cs -Raw -Encoding UTF8) -replace 'public const int Build = 0;', "public const int Build = ${{ github.run_number }};" |
            Set-Content build\DentalClinicClient.cs -Encoding UTF8
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /codepage:65001 /optimize+ /platform:anycpu `
            /out:build\DentalClinicClient.exe /win32icon:build\icon.ico /win32manifest:app.manifest `
            /r:build\Microsoft.Web.WebView2.Core.dll /r:build\Microsoft.Web.WebView2.WinForms.dll `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Management.dll /r:System.Core.dll /r:System.Web.Extensions.dll `
            build\DentalClinicClient.cs
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed.' }
      - name: Installer (Inno Setup)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\setup.iss "/DMyAppVersion=${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          $setup = Get-Item build\output\DentalClinicClientSetup-${{ github.run_number }}.exe
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName out\DentalClinicClientSetup.exe
          # Read by the client's update check (http://<server>/client/version.json).
          $sha = (Get-FileHash out\DentalClinicClientSetup.exe -Algorithm SHA256).Hash.ToLower()
          @{ build = ${{ github.run_number }}; file = 'DentalClinicClientSetup.exe'; sha256 = $sha; size = $setup.Length } |
            ConvertTo-Json | Set-Content out\version.json -Encoding ASCII
          Get-Content out\version.json
      - name: Install silently and check it starts
        timeout-minutes: 15
        run: |
          # Not -Wait: that also waits for the app Setup opens at the end, which keeps running.
          $p = Start-Process out\DentalClinicClientSetup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=C:\client-setup.log' -PassThru
          if (-not $p.WaitForExit(600000)) { Get-Content C:\client-setup.log -Tail 40; throw 'Setup did not finish.' }
          if ($p.ExitCode -ne 0) { Get-Content C:\client-setup.log -Tail 40; throw "Setup exited with $($p.ExitCode)" }
          $app = "${env:ProgramFiles}\Dental Clinic Client"
          foreach ($f in 'DentalClinicClient.exe', 'Microsoft.Web.WebView2.Core.dll', 'Microsoft.Web.WebView2.WinForms.dll', 'x64\WebView2Loader.dll', 'x86\WebView2Loader.dll') {
            if (-not (Test-Path "$app\$f")) { throw "$f was not installed." }
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Dental Clinic.lnk")) { throw 'No Start menu shortcut.' }
          # The installer opens the app at the end; it must still be running (no clinic server here, so it shows its error page).
          Start-Sleep -Seconds 20
          $running = Get-Process DentalClinicClient -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\DentalClinicClient\client.log" -Encoding UTF8 -ErrorAction SilentlyContinue
          if (-not $running) {
            Start-Process "$app\DentalClinicClient.exe"
            Start-Sleep -Seconds 20
            $running = Get-Process DentalClinicClient -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\DentalClinicClient\client.log" -Encoding UTF8 -ErrorAction SilentlyContinue
          }
          if (-not $running) { throw 'DentalClinicClient.exe did not stay open.' }
          $running | Stop-Process -Force
      - name: Self-test (WebView2, ticket raster, RAW print through Generic / Text Only)
        # Not yet seen passing on a runner: reported, but it does not hold back the offline release.
        continue-on-error: true
        run: |
          $app = "${env:ProgramFiles}\Dental Clinic Client"
          $dir = 'C:\client-selftest'
          New-Item -ItemType Directory -Force $dir | Out-Null
          if (-not (Select-String -Path "$env:LOCALAPPDATA\DentalClinicClient\client.log" -Pattern 'WebView2 ready' -Quiet)) { throw 'The app window did not get WebView2 running.' }
          $raw = @()
          try {
            Add-PrinterDriver -Name 'Generic / Text Only' -ErrorAction Stop
            Add-PrinterPort -Name "$dir\raw-out.bin" -ErrorAction Stop
            Add-Printer -Name 'DCTest' -DriverName 'Generic / Text Only' -PortName "$dir\raw-out.bin" -ErrorAction Stop
            $raw = @('--raw-printer', 'DCTest')
          } catch { Write-Host "::warning::Could not add the test printer: $_" }
          $p = Start-Process "$app\DentalClinicClient.exe" -ArgumentList (@('--selftest', $dir) + $raw) -PassThru
          if (-not $p.WaitForExit(120000)) { $p | Stop-Process -Force; throw 'The self-test did not finish.' }
          Get-Content "$dir\selftest.txt" -Encoding UTF8 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Self-test failed ($($p.ExitCode))." }
          if ($raw) {
            for ($i = 0; $i -lt 15 -and -not (Test-Path "$dir\raw-out.bin"); $i++) { Start-Sleep -Seconds 1 }
            Start-Sleep -Seconds 2
            $want = [IO.File]::ReadAllBytes("$dir\ticket.bin"); $got = [IO.File]::ReadAllBytes("$dir\raw-out.bin")
            Write-Host "RAW: sent $($want.Length) bytes, printer port got $($got.Length)"
            if ($got.Length -ne $want.Length -or [Convert]::ToBase64String($got) -ne [Convert]::ToBase64String($want)) { throw 'The RAW print did not arrive unchanged.' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-selftest
          path: C:\client-selftest
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: |
            offline/windows/client/out/DentalClinicClientSetup.exe
            offline/windows/client/out/version.json
          retention-days: 3

  package:
    needs: [panel, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: gd, intl, zip, mbstring, pdo_mysql, sodium, fileinfo
          tools: composer
      # --prefer-install=auto overrides composer.json's preferred-install=dist,
      # which stops Composer from falling back to a git clone when GitHub's zip
      # download fails (2026-10-15: codeload keeps 404ing the ziggy zip).
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-install=auto

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Assemble the app
        run: |
          OUT=dist/DentalClinicOffline
          mkdir -p $OUT/app
          rsync -a ./ $OUT/app/ \
            --exclude .git --exclude .github --exclude node_modules --exclude flutter_app \
            --exclude tests --exclude offline --exclude 'public/downloads' --exclude 'public/hot' \
            --exclude '.env' --exclude 'storage/logs/*.log' --exclude codemagic.yaml --exclude docs
          cp offline/windows/env.offline $OUT/app/.env.offline
          cp offline/windows/prepare.ps1 offline/windows/config.txt $OUT/
          cp -r offline/windows/setup $OUT/setup
          cp offline/README.md $OUT/README.md
          # The panel compares this with the newest release to offer updates.
          echo ${{ github.run_number }} > $OUT/version.txt
          sed -i 's/\r*$/\r/' $OUT/*.ps1 $OUT/config.txt

      - uses: actions/download-artifact@v4
        with:
          name: panel
          path: dist/DentalClinicOffline

      # The program for the other computers, served on the LAN at http://clinic.lan/client/.
      - uses: actions/download-artifact@v4
        with:
          name: client
          path: dist/DentalClinicOffline/client
      - name: Client download page
        run: |
          cp offline/windows/client/index.html dist/DentalClinicOffline/client/index.html
          test -f dist/DentalClinicOffline/client/DentalClinicClientSetup.exe
          jq -e '.build > 0' dist/DentalClinicOffline/client/version.json

      # The Windows, Android and iPhone apps, served on the LAN at
      # http://clinic.lan/apps/ (the apps' own update check reads
      # apps/releases.json there in clinic-server mode). Copied from the
      # latest builds on the hosting.
      - name: Apps for phones and computers
        run: |
          OUT=dist/DentalClinicOffline/apps
          SITE=https://dental.azoclinic.duckdns.org/downloads
          mkdir -p $OUT
          cp offline/windows/apps/index.html $OUT/index.html
          curl -fsSL --retry 3 "$SITE/releases.json" -o rel.json
          echo '{}' > $OUT/releases.json
          # The "offline" Android/Windows builds start on this server (see flutter-apps.yml).
          for p in windows android ios; do
            src=$p
            [ -n "$(jq -r --arg p ${p}_offline '.[$p].url // empty' rel.json)" ] && src=${p}_offline
            url=$(jq -r --arg p $src '.[$p].url // empty' rel.json)
            [ -n "$url" ] || continue
            f=$(basename "$url")
            curl -fsSL --retry 3 -o "$OUT/$f" "$url"
            jq --arg p $p --arg v "$(jq -r --arg p $src '.[$p].version' rel.json)" --arg u "/apps/$f" \
              '.[$p] = {version: $v, url: $u, notes: null}' $OUT/releases.json > t.json && mv t.json $OUT/releases.json
          done
          cat $OUT/releases.json
          ls -la $OUT
          jq -e '.android.url' $OUT/releases.json

      - name: Windows PHP
        run: |
          OUT=dist/DentalClinicOffline
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o php-releases.json https://windows.php.net/downloads/releases/releases.json
          VER=$(jq -r --arg m "$PHP_MINOR" '.[$m].version' php-releases.json)
          ZIP=$(jq -r --arg m "$PHP_MINOR" '.[$m]["nts-vs16-x64"].zip.path' php-releases.json)
          echo "PHP: $VER ($ZIP)"
          if [ "$(printf '%s\n%s\n' "$PHP_MIN_VERSION" "$VER" | sort -V | head -1)" != "$PHP_MIN_VERSION" ]; then
            echo "::error::Windows PHP $VER is older than $PHP_MIN_VERSION (security fix); not building."; exit 1
          fi
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o php.zip "https://windows.php.net/downloads/releases/$ZIP"
          mkdir -p $OUT/php && unzip -q php.zip -d $OUT/php
          cat $OUT/php/php.ini-production offline/windows/php.ini.overrides > $OUT/php/php.ini.template
          rm -rf $OUT/php/dev $OUT/php/extras
          # CA list for HTTPS from PHP (activation), see php.ini.overrides.
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $OUT/php/cacert.pem https://curl.se/ca/cacert.pem
          grep -q 'BEGIN CERTIFICATE' $OUT/php/cacert.pem
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $OUT/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      - name: Windows MariaDB
        run: |
          OUT=dist/DentalClinicOffline
          curl -fsSL -o mariadb.zip "https://archive.mariadb.org/mariadb-${MARIADB_VERSION}/winx64-packages/mariadb-${MARIADB_VERSION}-winx64.zip"
          unzip -q mariadb.zip -d tmpdb
          mv tmpdb/mariadb-* $OUT/mariadb
          rm -rf $OUT/mariadb/mysql-test $OUT/mariadb/sql-bench $OUT/mariadb/include $OUT/mariadb/data
          find $OUT/mariadb -name '*.pdb' -delete
          test -f $OUT/mariadb/bin/mariadbd.exe && test -f $OUT/mariadb/bin/mariadb-install-db.exe

      - name: Caddy (web server) and CoreDNS (local name)
        run: |
          OUT=dist/DentalClinicOffline
          mkdir -p $OUT/caddy $OUT/coredns
          curl -fsSL -o caddy.zip "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_windows_amd64.zip"
          unzip -q -o caddy.zip caddy.exe -d $OUT/caddy
          curl -fsSL -o coredns.tgz "https://github.com/coredns/coredns/releases/download/v${COREDNS_VERSION}/coredns_${COREDNS_VERSION}_windows_amd64.tgz"
          tar -xzf coredns.tgz -C $OUT/coredns
          test -f $OUT/caddy/caddy.exe && test -f $OUT/coredns/coredns.exe

      - name: Zip
        run: |
          cd dist && zip -qr9 ../DentalClinicOffline-windows.zip DentalClinicOffline
          ls -la ../DentalClinicOffline-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: offline
          path: DentalClinicOffline-windows.zip
          retention-days: 3

  smoke-test:
    # Unzip on a real Windows machine, start it through the panel and wait for the
    # login page, so a broken package never gets published.
    needs: package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline
      - name: Start through DentalClinic.exe and wait for the login page
        shell: pwsh
        run: |
          # The checks below run without activation; the last step checks the gate itself.
          $env:OFFLINE_ACTIVATION = 'false'
          Expand-Archive DentalClinicOffline-windows.zip -DestinationPath C:\
          # Port 80 is reserved on the runner; exercise the port settings instead.
          (Get-Content C:\DentalClinicOffline\config.txt) -replace '^HTTP_PORT=80$', 'HTTP_PORT=8080' -replace '^HTTPS_PORT=443$', 'HTTPS_PORT=8443' |
            Set-Content C:\DentalClinicOffline\config.txt
          Start-Process -FilePath C:\DentalClinicOffline\DentalClinic.exe -ArgumentList '--headless' -WorkingDirectory C:\DentalClinicOffline
          Start-Sleep -Seconds 60
          Write-Host '== early check'
          Get-Process php-cgi,caddy -ErrorAction SilentlyContinue | Format-Table Name,Id | Out-String | Write-Host
          Get-Content C:\DentalClinicOffline\app\storage\logs\panel.log -Encoding UTF8 -ErrorAction SilentlyContinue
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8080/login -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Get-ChildItem C:\DentalClinicOffline\app\storage\logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          Get-ChildItem C:\DentalClinicOffline\data\*.err -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 20 }
          if (-not $ok) {
            Write-Host '== panel.log'; Get-Content C:\DentalClinicOffline\app\storage\logs\panel.log -Encoding UTF8 -ErrorAction SilentlyContinue
            Write-Host '== processes'; Get-Process php*,caddy,coredns,mariadbd -ErrorAction SilentlyContinue | Format-Table Name,Id,Path | Out-String | Write-Host
            Write-Host '== Caddyfile'; Get-Content C:\DentalClinicOffline\Caddyfile -ErrorAction SilentlyContinue
            Write-Host '== caddy validate'; & C:\DentalClinicOffline\caddy\caddy.exe validate --config C:\DentalClinicOffline\Caddyfile --adapter caddyfile 2>&1 | Select-Object -Last 10
            Write-Host '== php-cgi'; & C:\DentalClinicOffline\php\php-cgi.exe -v 2>&1
            Write-Host '== php-cgi.log'; Get-Content C:\DentalClinicOffline\app\storage\logs\php-cgi.log -TotalCount 20 -ErrorAction SilentlyContinue
            Write-Host '== listening'; Get-NetTCPConnection -State Listen | Where-Object { $_.LocalPort -in 53,80,443,3307,8080,8443,9100,9101 } | Format-Table LocalAddress,LocalPort,OwningProcess | Out-String | Write-Host
            throw 'The offline package did not serve the login page.'
          }
          $admin = & C:\DentalClinicOffline\mariadb\bin\mariadb.exe --user=root --host=127.0.0.1 --port=3307 -N -e "select username from dental.users where username='admin'"
          if ($admin -ne 'admin') { throw 'Admin account was not created.' }

          Write-Host 'DNS:'
          $dns = Resolve-DnsName -Name clinic.lan -Server 127.0.0.1 -DnsOnly -Type A
          $dns | Format-Table | Out-String | Write-Host
          if (-not $dns.IPAddress) { throw 'clinic.lan did not resolve.' }

          $ip = (Get-Content C:\DentalClinicOffline\lan-ip.txt).Trim()
          Write-Host "LAN IP: $ip"
          $https = Invoke-WebRequest -Uri "https://${ip}:8443/login" -UseBasicParsing -SkipCertificateCheck -TimeoutSec 30
          if ($https.StatusCode -ne 200) { throw 'HTTPS login page failed.' }
          $redir = curl.exe -s -o NUL -w '%{http_code}' --max-time 30 "http://${ip}:8080/login"
          if ($redir -notin '301','302','307','308') { throw "http on the LAN should redirect to https, got $redir" }
          # An address the certificate was not made for (here 127.0.0.1) still opens over https.
          $other = curl.exe -sk -o NUL -w '%{http_code}' --max-time 30 https://127.0.0.1:8443/login
          if ($other -ne '200') { throw "https on another address of this computer should open, got $other" }
          $named = curl.exe -sk -o NUL -w '%{http_code}' --max-time 15 --resolve "unknown.example:8443:$ip" https://unknown.example:8443/login
          if ($named -eq '200') { throw 'A certificate was made for an unknown name.' }
          $ca = Invoke-WebRequest -Uri "http://${ip}:8080/ca.crt" -UseBasicParsing -TimeoutSec 30
          if ($ca.StatusCode -ne 200 -or $ca.RawContentLength -lt 300) { throw 'Certificate download failed.' }
          $setup = Invoke-WebRequest -Uri "http://${ip}:8080/setup" -UseBasicParsing -TimeoutSec 30
          if ($setup.Content -notmatch 'ca.crt') { throw 'Setup page failed.' }
          $localSetup = curl.exe -s --max-time 30 http://127.0.0.1:8080/setup
          if (($localSetup -join "`n") -notmatch 'ca.crt') { throw 'The setup page is not served on this computer (panel button).' }
          Write-Host 'Client program for the other computers:'
          $cv = (curl.exe -s --max-time 30 "http://${ip}:8080/client/version.json") -join '' | ConvertFrom-Json
          Write-Host "client build $($cv.build)"
          if ($cv.build -lt 1 -or $cv.file -ne 'DentalClinicClientSetup.exe') { throw 'client/version.json is wrong.' }
          $cexe = curl.exe -s -o NUL -w '%{http_code} %{size_download}' --max-time 60 "http://${ip}:8080/client/DentalClinicClientSetup.exe"
          Write-Host "client installer: $cexe"
          if ($cexe -notmatch '^200 [1-9]\d{5,}') { throw "The client installer is not served, got $cexe" }
          $cpage = curl.exe -s -o NUL -w '%{http_code}' --max-time 30 http://127.0.0.1:8080/client/
          if ($cpage -ne '200') { throw "The client page is not served on this computer, got $cpage" }
          Write-Host 'Apps for phones and computers:'
          $rel = (curl.exe -s --max-time 30 "http://${ip}:8080/apps/releases.json") -join '' | ConvertFrom-Json
          if (-not $rel.android.url) { throw 'apps/releases.json has no Android app.' }
          $apk = curl.exe -s -o NUL -w '%{http_code} %{size_download}' --max-time 120 "http://${ip}:8080$($rel.android.url)"
          Write-Host "android $($rel.android.version): $apk"
          if ($apk -notmatch '^200 [1-9]\d{6,}') { throw "The Android app is not served, got $apk" }
          $apage = curl.exe -s -o NUL -w '%{http_code}' --max-time 30 "http://${ip}:8080/apps/"
          if ($apage -ne '200') { throw "The apps page is not served, got $apage" }

          Write-Host 'Auto-open on joining the Wi-Fi (captive check):'
          $cdns = Resolve-DnsName -Name connectivitycheck.gstatic.com -Server 127.0.0.1 -DnsOnly -Type A
          if ($cdns.IPAddress -notcontains $ip) { throw 'The connectivity check address does not point at this computer.' }
          $first = curl.exe -s -o NUL -w '%{http_code} %{redirect_url}' --max-time 30 -H 'Host: connectivitycheck.gstatic.com' "http://${ip}:8080/generate_204"
          Write-Host "first check: $first"
          if ($first -notmatch '^302 .*/portal$') { throw "A new device should be sent to the portal, got $first" }
          $portal = curl.exe -s -o NUL -w '%{http_code} %{redirect_url}' --max-time 30 -H 'Host: clinic.lan' "http://${ip}:8080/portal"
          Write-Host "portal: $portal"
          if ($portal -notmatch '^302 .*/setup$') { throw "The portal should open the setup page, got $portal" }
          $again = curl.exe -s -o NUL -w '%{http_code}' --max-time 30 -H 'Host: connectivitycheck.gstatic.com' "http://${ip}:8080/generate_204"
          if ($again -ne '204') { throw "After the portal the device should see the Wi-Fi as connected, got $again" }

          Write-Host 'Load: 200 HTTPS requests, 50 at a time'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $codes = 1..200 | ForEach-Object -Parallel {
            try { (Invoke-WebRequest -Uri "https://$($using:ip):8443/login" -UseBasicParsing -SkipCertificateCheck -TimeoutSec 60).StatusCode } catch { 0 }
          } -ThrottleLimit 50
          $sw.Stop()
          $okCount = ($codes | Where-Object { $_ -eq 200 }).Count
          Write-Host "200 OK: $okCount / 200 in $([int]$sw.Elapsed.TotalSeconds)s"
          if ($okCount -lt 195) { throw 'Too many failed requests under load.' }

          Write-Host 'Self-healing: kill the web server, the panel must restart it'
          Stop-Process -Name caddy -Force
          Start-Sleep -Seconds 10
          $back = curl.exe -s -o NUL -w '%{http_code}' --max-time 30 http://127.0.0.1:8080/login
          if ($back -ne '200') { throw "The panel did not restart the web server, got $back" }

          Write-Host 'Backups: settings copy, backup now, restore'
          $backups = 'C:\DentalClinicBackups'
          if (-not (Test-Path "$backups\settings\.env")) { throw 'The settings were not copied to the backups folder.' }
          $env:PATH = "C:\DentalClinicOffline\php;C:\DentalClinicOffline\mariadb\bin;$env:PATH"
          $db = @('--user=root', '--host=127.0.0.1', '--port=3307', '-N')
          Push-Location C:\DentalClinicOffline\app
          php artisan backup:run --force
          if ($LASTEXITCODE -ne 0) { throw 'backup:run failed.' }
          $zip = Get-ChildItem "$backups\*.zip" | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $zip) { throw 'No backup zip was written.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $reader = New-Object IO.StreamReader($z.GetEntry('database.sql').Open())
          $sql = $reader.ReadToEnd(); $reader.Close(); $z.Dispose()
          if ($sql -notmatch "'admin'") { throw 'The backup does not hold the users.' }
          Write-Host "backup: $($zip.Name) ($($zip.Length) bytes)"
          mariadb @db -e "update dental.users set email='changed@example.com' where username='admin'"
          php artisan backup:restore $zip.FullName --force
          if ($LASTEXITCODE -ne 0) { throw 'backup:restore failed.' }
          $email = mariadb @db -e "select email from dental.users where username='admin'"
          if ($email -eq 'changed@example.com') { throw 'The restore did not bring the data back.' }
          if (-not (Get-ChildItem "$backups\*_before-restore.zip")) { throw 'The data was not saved before restoring.' }
          Pop-Location

          Write-Host 'Stop: everything must exit and the database shut down cleanly'
          Start-Process -FilePath C:\DentalClinicOffline\DentalClinic.exe -ArgumentList '--stop' -Wait
          $left = Get-Process php-cgi,php,caddy,coredns,mariadbd,DentalClinic -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Name,Id | Out-String | Write-Host; throw 'Processes were left running after --stop.' }

          Write-Host 'Update: a new version with a migration is backed up before it runs'
          Set-Content C:\DentalClinicOffline\app\database\migrations\2099_01_01_000000_smoke_update.php '<?php return new class extends Illuminate\Database\Migrations\Migration { public function up(): void {} };'
          Start-Process -FilePath C:\DentalClinicOffline\DentalClinic.exe -ArgumentList '--headless' -WorkingDirectory C:\DentalClinicOffline
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Seconds 5
            $ok = (curl.exe -s -o NUL -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/login) -eq '200'
          }
          Get-Content C:\DentalClinicOffline\app\storage\logs\panel.log -Encoding UTF8 -Tail 15
          if (-not $ok) { throw 'The system did not start again after the update.' }
          if (-not (Get-ChildItem "$backups\*_before-update.zip")) { throw 'No backup was made before the update.' }
          Start-Process -FilePath C:\DentalClinicOffline\DentalClinic.exe -ArgumentList '--stop' -Wait

      - name: In-app update keeps the data, and a broken update rolls back
        shell: pwsh
        run: |
          $env:OFFLINE_ACTIVATION = 'false'
          $root = 'C:\DentalClinicOffline'
          $env:PATH = "$root\mariadb\bin;$env:PATH"
          $db = @('--user=root', '--host=127.0.0.1', '--port=3307', '-N')
          function Wait-Login {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 5
              if ((curl.exe -s -o NUL -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/login) -eq '200') { return $true }
            }
            return $false
          }
          function New-Package($build, [scriptblock]$change) {
            $dir = "C:\pkg-$build"
            Expand-Archive DentalClinicOffline-windows.zip -DestinationPath $dir
            Set-Content "$dir\DentalClinicOffline\version.txt" $build
            if ($change) { & $change "$dir\DentalClinicOffline" }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [IO.Compression.ZipFile]::CreateFromDirectory("$dir\DentalClinicOffline", "C:\update-$build.zip", 'Fastest', $true)
            Remove-Item $dir -Recurse -Force
            return "C:\update-$build.zip"
          }
          function Show-Log { Get-Content "$root\app\storage\logs\panel.log" -Encoding UTF8 -Tail 30 }

          Start-Process -FilePath "$root\DentalClinic.exe" -ArgumentList '--headless' -WorkingDirectory $root
          if (-not (Wait-Login)) { Show-Log; throw 'The system did not start.' }
          mariadb @db -e "create table if not exists dental.smoke_keep (v int); insert into dental.smoke_keep values (42)"
          Set-Content "$root\app\storage\app\smoke-keep.txt" 'kept'
          $key = (Select-String -Path "$root\app\.env" -Pattern '^APP_KEY=').Line
          $before = (Get-ChildItem 'C:\DentalClinicBackups\*.zip').Count

          Write-Host 'Update to build 99999 while the system runs'
          $zip = New-Package 99999 $null
          # -Wait would also wait for the new panel it starts, which keeps running.
          $p = Start-Process -FilePath "$root\DentalClinic.exe" -ArgumentList '--apply-update', $zip -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { Show-Log; throw 'Applying the update failed.' }
          if (-not (Wait-Login)) { Show-Log; throw 'The updated system did not start.' }
          for ($i = 0; $i -lt 30 -and (Test-Path "$root\updates\rollback"); $i++) { Start-Sleep -Seconds 2 }
          Show-Log
          if ((Get-Content "$root\version.txt").Trim() -ne '99999') { throw 'The new version was not put in place.' }
          if (Test-Path "$root\updates\rollback") { throw 'The previous version was not cleaned up after a good update.' }
          if ((mariadb @db -e 'select v from dental.smoke_keep') -ne '42') { throw 'The data was lost in the update.' }
          if ((Get-Content "$root\app\storage\app\smoke-keep.txt") -ne 'kept') { throw 'Uploaded files were lost in the update.' }
          if ((Select-String -Path "$root\app\.env" -Pattern '^APP_KEY=').Line -ne $key) { throw 'The settings (.env) changed in the update.' }
          if ((Get-ChildItem 'C:\DentalClinicBackups\*.zip').Count -le $before) { throw 'No backup was made before applying the update.' }

          Write-Host 'A broken update (build 100000) must roll back to 99999 with its data'
          $bad = New-Package 100000 { param($d) Set-Content "$d\app\bootstrap\app.php" '<?php throw new Exception("broken on purpose");' }
          mariadb @db -e "update dental.smoke_keep set v = 43"
          # -Wait would also wait for the new panel it starts, which keeps running.
          $p = Start-Process -FilePath "$root\DentalClinic.exe" -ArgumentList '--apply-update', $bad -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { Show-Log; throw 'Applying the broken update did not get as far as starting it.' }
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 5
            $ok = (Test-Path "$root\updates\failed-build.txt") -and -not (Test-Path "$root\updates\rollback") -and
              ((curl.exe -s -o NUL -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/login) -eq '200')
          }
          Show-Log
          if (-not $ok) { throw 'The broken update did not roll back.' }
          if ((Get-Content "$root\version.txt").Trim() -ne '99999') { throw 'The previous version did not come back.' }
          if ((Get-Content "$root\updates\failed-build.txt").Trim() -ne '100000') { throw 'The failed build was not recorded.' }
          if ((mariadb @db -e 'select v from dental.smoke_keep') -ne '43') { throw 'The data changed in the rollback.' }
          if ((Get-Content "$root\app\storage\app\smoke-keep.txt") -ne 'kept') { throw 'Uploaded files were lost in the rollback.' }
          Start-Process -FilePath "$root\DentalClinic.exe" -ArgumentList '--stop' -Wait

      - name: Without an activation code every page leads to the activation page
        shell: pwsh
        run: |
          $root = 'C:\DentalClinicOffline'
          Start-Process -FilePath "$root\DentalClinic.exe" -ArgumentList '--headless' -WorkingDirectory $root
          $code = ''
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            $code = curl.exe -s -o NUL -w '%{http_code} %{redirect_url}' --max-time 10 http://127.0.0.1:8080/login
            if ($code -match '^30') { break }
          }
          Write-Host "login: $code"
          if ($code -notmatch '^302 .*/activate$') { Get-Content "$root\app\storage\logs\panel.log" -Encoding UTF8 -Tail 30; throw "Before activation /login should lead to /activate, got $code" }
          try { $page = Invoke-WebRequest -Uri http://127.0.0.1:8080/activate -UseBasicParsing -TimeoutSec 30 }
          catch { Get-ChildItem "$root\app\storage\logs\laravel*.log" | ForEach-Object { Select-String -Path $_.FullName -Pattern '\.ERROR: ' | Select-Object -Last 3 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(1500, $_.Line.Length)) } }; throw }
          if ($page.Content -notmatch '[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}') { throw 'The activation page does not show the machine id.' }
          $api = curl.exe -s -o NUL -w '%{http_code}' --max-time 10 -H 'Accept: application/json' http://127.0.0.1:8080/api/v1/branding
          if ($api -ne '403') { throw "Before activation the API should refuse, got $api" }
          & "$root\php\php.exe" -r "exit(function_exists('sodium_crypto_sign_verify_detached') ? 0 : 1);"
          if ($LASTEXITCODE -ne 0) { throw 'sodium is missing from the bundled PHP.' }
          # Activation calls the hosting over HTTPS; this fails without a CA list.
          & "$root\php\php.exe" -c "$root\php\php.ini" -r "`$c = curl_init('https://www.google.com/'); curl_setopt(`$c, CURLOPT_RETURNTRANSFER, true); curl_setopt(`$c, CURLOPT_NOBODY, true); curl_exec(`$c); `$e = curl_error(`$c); echo `$e; exit(`$e === '' ? 0 : 1);"
          if ($LASTEXITCODE -ne 0) { throw 'The bundled PHP cannot make HTTPS calls (activation would fail).' }
          Start-Process -FilePath "$root\DentalClinic.exe" -ArgumentList '--stop' -Wait

  release:
    needs: [package, smoke-test, client]
    # Installed copies update themselves from the hosting (2026-10-17, by
    # request), so only main uploads a build there; other branches just
    # build and test. The zip goes to public/downloads/offline/ with
    # latest.json, read by /download and api/v1/offline/latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      SITE: https://dental.azoclinic.duckdns.org/downloads/offline
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline
      # The program for the other computers, also listed on /download.
      - uses: actions/download-artifact@v4
        with:
          name: client
          path: client
      - name: Upload to the hosting
        run: |
          N=${{ github.run_number }}
          FILE=DentalClinicOffline-$N.zip
          mv DentalClinicOffline-windows.zip $FILE
          CLIENT=DentalClinicClientSetup-$N.exe
          mv client/DentalClinicClientSetup.exe $CLIENT
          jq -n --argjson build $N --arg file $FILE --arg url "$SITE/$FILE" --argjson size $(stat -c %s $FILE) \
            --arg sha256 $(sha256sum $FILE | cut -d' ' -f1) --arg commit ${{ github.sha }} --arg at "$(date -u +%FT%TZ)" \
            --arg client_file $CLIENT --arg client_url "$SITE/$CLIENT" --argjson client_size $(stat -c %s $CLIENT) \
            --arg client_sha256 $(sha256sum $CLIENT | cut -d' ' -f1) \
            '{build: $build, file: $file, url: $url, size: $size, sha256: $sha256, commit: $commit, published_at: $at,
              client_file: $client_file, client_url: $client_url, client_size: $client_size, client_sha256: $client_sha256}' > latest.json
          cat latest.json
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          vps() { ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "$@"; }
          dir="$VPS_APP_DIR/public/downloads/offline"
          vps "mkdir -p '$dir'"
          # File first, manifest last, so nothing ever points at a missing file.
          vps "cat > '$dir/$FILE.part' && mv '$dir/$FILE.part' '$dir/$FILE'" < $FILE
          vps "cat > '$dir/$CLIENT.part' && mv '$dir/$CLIENT.part' '$dir/$CLIENT'" < $CLIENT
          vps "cat > '$dir/latest.json.tmp' && mv '$dir/latest.json.tmp' '$dir/latest.json'" < latest.json
          # Keep this build and the one before it (for copies mid-download).
          vps "cd '$dir' && ls -1t DentalClinicOffline-*.zip | tail -n +3 | xargs -r rm -f --; ls -1t DentalClinicClientSetup-*.exe | tail -n +3 | xargs -r rm -f --; ls -la"
          got=$(curl -fsS -o /dev/null -w '%{http_code}' "$SITE/$FILE" -r 0-0 || true)
          echo "download check: $got"
          [ "$got" = 206 ] || [ "$got" = 200 ] || { echo "The uploaded build is not reachable."; exit 1; }
