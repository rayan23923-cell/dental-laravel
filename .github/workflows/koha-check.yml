name: Koha check (read-only)
on:
  push:
    branches: [diag/koha-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: 167.86.66.47
    steps:
      - name: Response times
        run: |
          mkdir -p out
          probe() { curl -s -o /dev/null -w "%{http_code} connect=%{time_connect}s first-byte=%{time_starttransfer}s total=%{time_total}s size=%{size_download}\n" --max-time 60 "$1" || echo "FAILED (timeout or refused)"; }
          {
          for u in "http://$HOST:8080/cgi-bin/koha/mainpage.pl" "http://$HOST/cgi-bin/koha/opac-main.pl" "http://$HOST/cgi-bin/koha/opac-search.pl?q=medicine" "http://$HOST:8080/intranet-tmpl/prog/css/staff-global.css"; do
            echo "== $u"; for i in $(seq 1 5); do probe "$u"; done
          done
          echo "== 3 minutes, one request to staff login every 10s"
          for i in $(seq 1 18); do echo "$(date -u +%T) $(probe "http://$HOST:8080/cgi-bin/koha/mainpage.pl")"; sleep 10; done
          echo "== 10 parallel requests to OPAC search"
          for i in $(seq 1 10); do probe "http://$HOST/cgi-bin/koha/opac-search.pl?q=dental" & done; wait
          } | tee out/timings.txt
      - name: Screenshots
        run: |
          npm i -q playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1366, height: 900 } });
            const pages = [
              ['1-staff-login', `http://${process.env.HOST}:8080/cgi-bin/koha/mainpage.pl`],
              ['2-opac-home', `http://${process.env.HOST}/cgi-bin/koha/opac-main.pl`],
              ['3-opac-search', `http://${process.env.HOST}/cgi-bin/koha/opac-search.pl?q=medicine`],
            ];
            for (const [name, url] of pages) {
              const t = Date.now();
              try {
                await p.goto(url, { waitUntil: 'load', timeout: 90000 });
                console.log(`${name}: fully loaded in ${((Date.now() - t) / 1000).toFixed(1)}s`);
              } catch (e) { console.log(`${name}: ${e.message.split('\n')[0]}`); }
              await p.screenshot({ path: `out/${name}.png`, fullPage: false }).catch(() => {});
            }
            await b.close();
          })();
          JS
          node shot.js | tee out/browser.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koha-check
          path: out
