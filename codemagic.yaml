workflows:
  android-workflow:
    name: Dental Clinic App - Android
    max_build_duration: 60
    working_directory: flutter_app
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK (release)
        # Without --dart-define, AppConfig.baseUrl falls back to its
        # zero-config dev default (10.0.2.2, the Android emulator's alias
        # for the host machine) — useless in a real release build, which
        # needs the actual production API.
        script: flutter build apk --release --dart-define=API_BASE_URL=https://cdclinics.com/api/v1
    artifacts:
      - "**/outputs/**/*.apk"
      - "**/outputs/**/mapping.txt"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

  android-play-internal:
    # Signed .aab for Google Play's Internal Testing track (2026-09-02) —
    # separate from android-workflow above, which stays debug-signed and
    # produces an .apk (fine for ad-hoc installs, but Play Console
    # rejects both a debug-signed upload and an .apk outright — it only
    # accepts a release-signed .aab).
    #
    # One-time setup needed before this workflow can run at all (none of
    # which this file can do — a real signing secret must never live in
    # a committed file):
    #   1. Generate your own upload keystore once, on your own machine —
    #      never here, never shared with anyone:
    #        keytool -genkeypair -v -keystore upload-keystore.jks \
    #          -keyalg RSA -keysize 2048 -validity 10000 -alias upload
    #      Back this .jks file up somewhere safe outside this repo —
    #      losing it means losing the ability to ever update this app on
    #      Play Console again under the same listing.
    #   2. In Codemagic's own dashboard: this app -> Code signing
    #      identities -> Android keystores -> upload that .jks, giving it
    #      the reference name `dental_clinic_upload_keystore` (must match
    #      the `android_signing` line below exactly) and entering the
    #      same store/key passwords and alias used in step 1.
    #   3. Trigger this workflow manually from Codemagic's "Start new
    #      build" button (no `triggering:` block below on purpose — an
    #      Internal Testing upload should be a deliberate action, not
    #      fired on every push to main the way the other two workflows
    #      are).
    #   4. Download the resulting .aab from the finished build's
    #      artifacts and upload it yourself under Play Console -> Testing
    #      -> Internal testing -> Create new release (this last step
    #      needs your own Google account login, which nothing here can
    #      do on your behalf).
    name: Dental Clinic App - Android (Play Internal Testing)
    max_build_duration: 60
    working_directory: flutter_app
    environment:
      flutter: stable
      android_signing:
        - dental_clinic_upload_keystore
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle (release, signed)
        script: flutter build appbundle --release --dart-define=API_BASE_URL=https://cdclinics.com/api/v1
    artifacts:
      - "**/outputs/**/*.aab"
      - "**/outputs/**/mapping.txt"

  ios-workflow:
    # Produces an UNSIGNED .ipa on purpose (--no-codesign) — no Apple
    # Developer account needed here. AltStore/AltServer does the actual
    # code-signing on install, using the free Apple ID configured in
    # AltServer on your computer, not anything from this build.
    name: Dental Clinic App - iOS (unsigned, for AltStore)
    max_build_duration: 60
    working_directory: flutter_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build unsigned iOS app
        # Same reasoning as the Android workflow's --dart-define: without
        # it, AppConfig.baseUrl falls back to `localhost`, which on a real
        # device means the device itself — never reachable.
        script: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://cdclinics.com/api/v1
      - name: Package as unsigned .ipa
        script: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -r ../../../dental_clinic_app_unsigned.ipa Payload
    artifacts:
      - "**/dental_clinic_app_unsigned.ipa"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
