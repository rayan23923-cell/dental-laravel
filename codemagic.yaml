workflows:
  android-workflow:
    name: Dental Clinic App - Android
    max_build_duration: 60
    working_directory: flutter_app
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK (release)
        script: flutter build apk --release
    artifacts:
      - flutter_app/build/app/outputs/**/*.apk
      - flutter_app/build/app/outputs/**/mapping.txt
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
