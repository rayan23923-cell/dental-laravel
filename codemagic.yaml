workflows:
  android-workflow:
    name: Dental Clinic App - Android
    max_build_duration: 60
    working_directory: flutter_app
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK (release)
        script: flutter build apk --release
    artifacts:
      - flutter_app/build/app/outputs/**/*.apk
      - flutter_app/build/app/outputs/**/mapping.txt
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

  ios-workflow:
    # Produces an UNSIGNED .ipa on purpose (--no-codesign) — no Apple
    # Developer account needed here. AltStore/AltServer does the actual
    # code-signing on install, using the free Apple ID configured in
    # AltServer on your computer, not anything from this build.
    name: Dental Clinic App - iOS (unsigned, for AltStore)
    max_build_duration: 60
    working_directory: flutter_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package as unsigned .ipa
        script: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -r ../../../dental_clinic_app_unsigned.ipa Payload
    artifacts:
      - flutter_app/dental_clinic_app_unsigned.ipa
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
