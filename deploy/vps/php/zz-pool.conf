; 4 cores and 24 GB RAM (2026-10-14), shared with the Oracle keepalive (~30% CPU) and Caddy:
; 40 workers at ~40-60 MB each (~2.5 GB at most), so the every-15-seconds refresh of the
; requests list and notifications from many open pages never queues behind slow requests.
[www]
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 16
pm.max_requests = 1000
; Matches max_execution_time and nginx's fastcgi_read_timeout (60s), so a
; stuck request frees its worker instead of holding it forever.
request_terminate_timeout = 65s
listen.backlog = 1024
