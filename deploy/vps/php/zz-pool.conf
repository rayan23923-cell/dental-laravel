; AWS t3.small (2026-11-25): 2 vCPU and 2 GB RAM shared with the files site and the SIS.
; 8 workers at ~40-60 MB each (~450 MB at most); the every-15-seconds refresh of the
; requests list and notifications is short, so 8 keep up with a clinic's open pages.
; On a bigger server raise max_children (it was 40 on the 24 GB Oracle server).
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; Matches max_execution_time and nginx's fastcgi_read_timeout (60s), so a
; stuck request frees its worker instead of holding it forever.
request_terminate_timeout = 65s
listen.backlog = 1024
