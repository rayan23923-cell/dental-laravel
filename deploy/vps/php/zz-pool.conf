; The VPS has 4 OCPU / 24 GB (resized 2026-10-08), shared with headscale, the
; separate /clinic app and the keepalive load (~30% CPU/RAM). 40 workers at
; ~40-60 MB each stay under ~2.5 GB, enough for a full clinic day of phones
; and PCs without one slow request queueing everyone else.
[www]
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 16
pm.max_requests = 1000
; Matches max_execution_time and nginx's fastcgi_read_timeout (60s), so a
; stuck request frees its worker instead of holding it forever.
request_terminate_timeout = 65s
listen.backlog = 1024
