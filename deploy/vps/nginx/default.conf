# Runs behind the Caddy HTTPS front end on the VPS (Docker network `headscale_default`).
# Only login submissions count (an empty key is never limited), so a whole college behind one NAT address can
# still open the page; 30/min per address leaves room for that shared address.
map $request_method $dental_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $dental_login_key zone=dental_login:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # The real client address (Caddy sits on a private Docker network).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 62m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Brute-force brake in front of PHP on login submissions.
    location = /login {
        limit_req zone=dental_login burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # The offline server package and LAN client are not public (2026-10-24, by request): Laravel checks a
    # signed-in admin or an activation code and hands the file back here with X-Accel-Redirect.
    location ^~ /downloads/offline/ {
        internal;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 60s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Caddy terminates TLS, so tell Laravel the original request was HTTPS (secure cookies, https:// URLs).
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(css|js|ico|png|jpg|jpeg|webp|svg|woff2?|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }
}
