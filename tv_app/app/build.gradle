plugins {
    id 'com.android.application'
}

// Version and signing come from the workflow (-PversionCode=…); local
// builds fall back to a debug-signed 1.0.
def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def vName = (project.findProperty('versionName') ?: '1.0').toString()

android {
    namespace 'com.dentalclinic.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dentalclinic.tv'
        minSdk 23
        // 28 like the adhan app (rayan23923-cell/azan_tv), which opens itself
        // after power-on on the clinic's Android 12 HiSilicon TV while this
        // app on 34 did not, with the same boot code and no special
        // permission. Keep it at 28 (2026-11-02, by request).
        targetSdk 28
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            def store = System.getenv('TV_KEYSTORE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('TV_KEYSTORE_PASSWORD')
                keyAlias 'dental'
                keyPassword System.getenv('TV_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('TV_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    // targetSdk 28 is "expired" for Google Play only; the TV app is not on Play.
    lint {
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
