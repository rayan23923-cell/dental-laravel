plugins {
    id 'com.android.application'
}

// Version and signing come from the workflow (-PversionCode=…); local
// builds fall back to a debug-signed 1.0.
def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def vName = (project.findProperty('versionName') ?: '1.0').toString()

android {
    namespace 'com.dentalclinic.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dentalclinic.tv'
        minSdk 22
        // Auto-start like adhan TV apps (2026-11-02, by request): on TVs that
        // lock "display over other apps" and accessibility settings, only an
        // app built for Android 5.1 (API 22) gets that permission at install,
        // which lets it open itself after boot and on every wake. Android
        // 14+ refuses to install such apps; those TVs keep the other ways.
        // Switching an installed copy from 34 to 22 needs one uninstall.
        //noinspection ExpiredTargetSdkVersion
        targetSdk 22
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            def store = System.getenv('TV_KEYSTORE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('TV_KEYSTORE_PASSWORD')
                keyAlias 'dental'
                keyPassword System.getenv('TV_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('TV_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        // ExpiredTargetSdkVersion is deliberate (see targetSdk above).
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
