name: dental_clinic_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # See flutter_app/README.md "Architecture" for why each of these was
  # chosen over the alternatives.
  dio: ^5.7.0                    # HTTP client + interceptors (bearer token, 401 handling)
  flutter_riverpod: ^2.6.1       # state management
  go_router: ^14.6.2             # declarative routing + deep links (QR scan -> task instance)
  flutter_secure_storage: ^9.2.2 # Sanctum token storage (Keychain/Keystore-backed)
  mobile_scanner: ^6.0.2         # task-instance QR check-in (mirrors the web app's QR feature)
  cached_network_image: ^3.4.1   # doctor photos, clinic/university logos
  image_picker: ^1.1.2           # doctor photo upload, surgery image uploads
  intl: ^0.20.2                  # Arabic/Gregorian date formatting (pinned by flutter_localizations)
  nfc_manager: ^4.1.1
  shared_preferences: ^2.5.5
  permission_handler: ^13.0.1
  connectivity_plus: ^6.1.3       # detects the offline->online edge to trigger case-sheet sync
  # Push notifications (task-started alerts) — inert until a real Firebase
  # project exists (see README.md's Firebase section). Safe to keep even
  # unconfigured: `PushNotificationService` no-ops when `Firebase.apps` is
  # empty, and the Android Google Services Gradle plugin only applies
  # itself when a real google-services.json is present.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_svg: ^2.3.0
  package_info_plus: ^8.1.2   # current app version, for the Windows desktop updater
  path_provider: ^2.1.5       # temp dir to download the Windows update installer into
  # QR scanning on the Windows app (mobile_scanner has no Windows camera):
  # webcam frames through camera_windows, decoded by the pure-Dart zxing2.
  # Only the Windows camera plugin is added, not `camera`, so the Android
  # and iOS builds are untouched. See desktop_qr_scanner.dart.
  camera_platform_interface: ^2.15.0
  camera_windows: ^0.3.0
  zxing2: ^0.2.4
  image: ^4.12.0

# permission_handler_android 14.0.0 (its own independently-versioned
# native-Android implementation package) ships an android/build.gradle.kts
# using the newer `kotlin { compilerOptions { jvmTarget = ... } }` Gradle
# DSL, which fails to resolve against this project's pinned Kotlin Gradle
# Plugin 2.1.0 / AGP 8.9.1 (confirmed via a real failed build, not
# assumed — "Unresolved reference: compilerOptions"). Those versions are
# pinned deliberately for this project's Android 8.1 (API 27) compatibility
# target, not something to bump just to satisfy one plugin's latest
# release. 13.0.1 (permission_handler's own top-level pin above) predates
# that DSL change and builds cleanly.
dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Windows desktop packaging — generates windows/runner's .ico from
  # assets/branding/app_logo.png (`dart run flutter_launcher_icons`), and
  # builds the installable .msix from the release build
  # (`dart run msix:create`). Dev-only: neither ships in the app itself.
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.9

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/branding/app_logo.png
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf
    # Head pain-location diagram reference images (Oral Medicine's
    # Extraoral/Intraoral Examination, `HeadDiagramsBoard`) — same source
    # files as web's public/images/head-diagrams/, bundled here since
    # they're static reference images, not admin-uploaded/mutable data
    # (2026-08-29).
    - assets/images/head_diagrams/frontal.jpg
    - assets/images/head_diagrams/posterior.jpg
    - assets/images/head_diagrams/right.jpg
    - assets/images/head_diagrams/left.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# `dart run flutter_launcher_icons` — regenerates the Android mipmap
# launcher icons, the iOS AppIcon.appiconset, and windows/runner's
# resources/app_icon.ico from the clinic logo (2026-08-25: extended to
# Android — was Windows-only before; 2026-08-27: extended to iOS, and to
# a proper Android adaptive icon instead of one flat image, using the
# college seal supplied that day with its white background keyed out).
# iOS gets its own pre-flattened, opaque (white-background) source —
# `remove_alpha_ios: true` alone isn't enough here: it only forces the
# alpha channel to 100%, it doesn't composite onto anything first, so
# whatever RGB value sits under a transparent pixel shows through as-is —
# and that was black for this source PNG (transparent canvases default to
# black RGB at alpha=0), producing a solid black icon. app_logo.png itself
# stays transparent, since it's also used in-app (login/splash screens)
# over a dark background, where a white square around the logo would look
# wrong.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_logo.png"
  image_path_ios: "assets/icon/app_icon_ios.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/branding/app_logo.png"
    icon_size: 256

# `dart run msix:create` — packages the release build
# (`flutter build windows --release`) into one installable .msix. No
# `certificate_path` set, so the package self-signs with a generated test
# certificate — fine for direct install on a machine that trusts it (see
# flutter_app/README.md's "Windows desktop build" section for the
# one-time trust step), not for Store submission.
msix_config:
  display_name: العيادة التعليمية
  publisher_display_name: كلية طب الأسنان - جامعة تكريت
  publisher: CN=DentistryCollegeTikrit
  identity_name: com.dentistrycollegetikrit.dentalclinicapp
  msix_version: 1.0.0.0
  logo_path: assets/branding/app_logo.png
  capabilities: internetClient
  languages: ar-sa, en-us
